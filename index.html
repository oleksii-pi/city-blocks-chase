<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Blocks Chase</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1f2a26;
      color: #f6f0df;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      background: #6f8c5a;
    }

    body.game-over canvas {
      filter: grayscale(1) brightness(0.72);
    }

    body.game-over.game-over-fade canvas {
      animation: gameOverFade 1.4s linear forwards;
    }

    @keyframes gameOverFade {
      from {
        filter: grayscale(1) brightness(0.72);
      }

      to {
        filter: grayscale(1) brightness(0.18);
      }
    }

    .dashboard {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: grid;
      gap: 8px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .scoreboard {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      display: grid;
      justify-items: center;
      min-width: 190px;
      padding: 10px 18px 12px;
      border: 1px solid rgba(255, 244, 210, 0.24);
      border-radius: 8px;
      background: rgba(20, 23, 22, 0.76);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .scoreboard span {
      color: #e8ddbf;
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
    }

    .scoreboard strong {
      color: #fff6d7;
      font-size: clamp(44px, 8vw, 78px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .scoreboard em {
      min-height: 14px;
      color: #f1c343;
      font-size: 12px;
      font-style: normal;
      line-height: 1;
    }

    .hud {
      display: grid;
      gap: 4px;
      min-width: 170px;
      padding: 9px 11px;
      border: 1px solid rgba(255, 244, 210, 0.22);
      border-radius: 8px;
      background: rgba(24, 28, 25, 0.78);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(5px);
    }

    .minimap {
      display: none;
      width: 200px;
      height: 200px;
      border: 1px solid rgba(255, 244, 210, 0.28);
      border-radius: 8px;
      background: rgba(24, 28, 25, 0.82);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(5px);
    }

    .minimap.visible {
      display: block;
    }

    .hud strong {
      color: #fff6d7;
      font-size: 13px;
      letter-spacing: 0;
    }

    .hud span {
      color: #e8ddbf;
      font-size: 12px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .message {
      position: fixed;
      left: 50%;
      top: 50%;
      display: none;
      min-width: 210px;
      padding: 16px 24px;
      border: 1px solid rgba(255, 244, 210, 0.22);
      border-radius: 8px;
      background: rgba(21, 24, 22, 0.9);
      color: #fff6d7;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .message.game-over {
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #ffffff;
      font-size: clamp(44px, 10vw, 118px);
      letter-spacing: 0;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
    }

    .controls {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      user-select: none;
    }

    .control {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255, 244, 210, 0.26);
      border-radius: 8px;
      background: rgba(22, 25, 24, 0.72);
      color: #fff4cf;
      font-size: 25px;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
      touch-action: none;
    }

    .control:active,
    .control.active {
      background: rgba(255, 244, 210, 0.9);
      color: #1c211e;
      transform: translateY(1px);
    }

    .control.up {
      grid-column: 2;
      grid-row: 1;
    }

    .control.left {
      grid-column: 1;
      grid-row: 2;
    }

    .control.down {
      grid-column: 2;
      grid-row: 2;
    }

    .control.right {
      grid-column: 3;
      grid-row: 2;
    }

    .debug-recorder {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 5;
      pointer-events: none;
      user-select: none;
    }

    body.debug-selecting .debug-recorder,
    body.debug-recording .debug-recorder,
    body.debug-recorder-status .debug-recorder {
      display: block;
    }

    body.debug-selecting .debug-recorder {
      cursor: crosshair;
      pointer-events: auto;
    }

    .debug-recorder-shade {
      position: absolute;
      display: none;
      background: rgba(5, 7, 8, 0.1);
      backdrop-filter: blur(1.4px) brightness(0.96);
      -webkit-backdrop-filter: blur(1.4px) brightness(0.96);
      pointer-events: none;
    }

    .debug-recorder-message {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      min-width: 210px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 244, 210, 0.28);
      border-radius: 8px;
      background: rgba(19, 22, 21, 0.86);
      color: #fff6d7;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      transform: translateX(-50%);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(5px);
      z-index: 2;
    }

    .debug-recorder-selection {
      position: absolute;
      display: none;
      min-width: 1px;
      min-height: 1px;
      border: 2px solid #fff6d7;
      border-radius: 2px;
      background: rgba(241, 195, 67, 0.14);
      box-shadow: 0 0 0 1px rgba(5, 7, 8, 0.32);
      z-index: 1;
    }

    @media (max-width: 640px) {
      .scoreboard {
        right: max(12px, env(safe-area-inset-right));
        left: auto;
        min-width: 118px;
        padding: 8px 10px 9px;
        transform: none;
      }

      .scoreboard strong {
        font-size: 40px;
      }

      .hud {
        min-width: 145px;
        padding: 8px 9px;
      }

      .controls {
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(2, 52px);
        gap: 7px;
      }

      .control {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Top-down city driving game"></canvas>

  <div class="dashboard">
    <div class="hud">
      <strong>Survive the Streets</strong>
      <span id="speed">Speed 0</span>
      <span id="wanted">Chasers 0</span>
      <span id="survival">Time 0:00</span>
      <span>Arrow keys or buttons</span>
    </div>
    <canvas id="minimap" class="minimap" width="200" height="200" aria-label="Police chase minimap"></canvas>
  </div>

  <div class="scoreboard" aria-live="polite">
    <span>Hit Score</span>
    <strong id="hitScore">0</strong>
    <em id="hitBonus"></em>
  </div>

  <div id="message" class="message"></div>

  <div id="debugRecorder" class="debug-recorder" aria-hidden="true">
    <div class="debug-recorder-shade" data-debug-shade="top"></div>
    <div class="debug-recorder-shade" data-debug-shade="right"></div>
    <div class="debug-recorder-shade" data-debug-shade="bottom"></div>
    <div class="debug-recorder-shade" data-debug-shade="left"></div>
    <div id="debugRecorderMessage" class="debug-recorder-message"></div>
    <div id="debugRecorderSelection" class="debug-recorder-selection"></div>
  </div>

  <div class="controls" aria-label="Driving controls">
    <button class="control up" data-key="ArrowUp" aria-label="Accelerate">▲</button>
    <button class="control left" data-key="ArrowLeft" aria-label="Turn left">◀</button>
    <button class="control down" data-key="ArrowDown" aria-label="Brake and reverse">▼</button>
    <button class="control right" data-key="ArrowRight" aria-label="Turn right">▶</button>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const speedEl = document.getElementById("speed");
    const wantedEl = document.getElementById("wanted");
    const survivalEl = document.getElementById("survival");
    const hitScoreEl = document.getElementById("hitScore");
    const hitBonusEl = document.getElementById("hitBonus");
    const messageEl = document.getElementById("message");
    const minimapCanvas = document.getElementById("minimap");
    const minimapCtx = minimapCanvas.getContext("2d");
    const debugRecorderEl = document.getElementById("debugRecorder");
    const debugRecorderMessageEl = document.getElementById("debugRecorderMessage");
    const debugRecorderSelectionEl = document.getElementById("debugRecorderSelection");
    const debugRecorderShadeEls = {
      top: debugRecorderEl.querySelector('[data-debug-shade="top"]'),
      right: debugRecorderEl.querySelector('[data-debug-shade="right"]'),
      bottom: debugRecorderEl.querySelector('[data-debug-shade="bottom"]'),
      left: debugRecorderEl.querySelector('[data-debug-shade="left"]')
    };

    const MINIMAP_SIZE = 200;
    const GRID = 16;
    const ROAD = 100;
    const BLOCK = 180;
    const CELL = ROAD + BLOCK;
    const WORLD = GRID * CELL + ROAD;
    const HOUSE = BLOCK / 3;
    const LANE_WIDTH = ROAD / 2;
    const HOUSE_CELLS = [[0, 0], [1, 0], [2, 0], [0, 1], [2, 1], [0, 2], [1, 2], [2, 2]];
    const TOTAL_CARS = 200;
    const POLICE_COUNT = 20;
    const TURN_ARC = 0.2;
    const UTURN_ARC = 0.36;
    const HIT_STOP_SECONDS = 1.2;
    const STUCK_ESCAPE_SECONDS = 3;
    const CHASE_CLOSE_DISTANCE = 3 * CELL;
    const CHASE_LOST_DISTANCE = 5 * CELL;
    const NO_CHASE_REST_SECONDS = 30;
    const RANDOM_CHASE_MIN_DISTANCE = 3 * CELL;
    const GAME_OVER_SPLASH_SECONDS = 2;
    const GAME_OVER_FADE_SECONDS = 1.4;
    const GAME_OVER_SECONDS = GAME_OVER_SPLASH_SECONDS + GAME_OVER_FADE_SECONDS;
    const POLICE_FRONT_HIT_DOT = 0.55;
    const POLICE_CHASE_LANES = [0, -LANE_WIDTH];
    const DEBUG_RECORDER_MIN_SIZE = 8;
    const DEBUG_RECORDER_STATUS_MS = 1600;
    const DEBUG_RECORDER_COLUMNS = [
      "t",
      "id",
      "type",
      "x",
      "y",
      "angle",
      "renderAngle",
      "speed",
      "vx",
      "vy",
      "screenX",
      "screenY",
      "fromIX",
      "fromIY",
      "toIX",
      "toIY",
      "progress",
      "lateral",
      "pushX",
      "pushY",
      "pushVX",
      "pushVY",
      "chasing",
      "blocked",
      "hitStop"
    ];
    const CAR_PHYSICS = {
      playerMaxSpeed: 200,
      playerReverseSpeed: -45,
      playerAcceleration: 170,
      playerBrake: 230,
      playerDrag: 0.93,
      playerMinMoveSpeed: 2,
      regularSpeed: 60,
      policeCruiseSpeed: 70,
      policeMaxSpeed: 120,
      aiAcceleration: 90,
      aiBrake: 150,
      aiTurnRate: 4.8,
      renderMinVectorSpeed: 1.5,
      renderTurnRate: 5.2,
      renderMaxSlipAngle: 0.48,
      renderMaxReverseSlipAngle: 0.2
    };
    const keys = new Set();
    const debugRecorder = {
      mode: "idle",
      selecting: false,
      pointerId: null,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0,
      area: null,
      startedAt: 0,
      copiedAt: 0,
      frames: 0,
      rows: []
    };

    const palette = {
      grass: "#738f58",
      road: "#2f3033",
      roadDark: "#25262a",
      sidewalk: "#d6c392",
      sidewalkLight: "#ead9aa",
      curb: "#f7ead2",
      lane: "#f7f3e7",
      courtyard: "#879d63",
      shadow: "rgba(30, 25, 18, 0.22)",
      roof: ["#c8754a", "#d1915d", "#b76c51", "#d5a45e", "#a96e56", "#c18663"],
      rightFace: ["#9e543d", "#a86843", "#8b5746", "#a8783f", "#875843", "#9a654a"],
      bottomFace: ["#b15f42", "#bf784e", "#9d604e", "#bb8849", "#975f47", "#ab7052"],
      policeRoof: "#2f65a8",
      policeFace: "#244a7d",
      glass: "#62b8e2",
      glassDark: "#397fa6",
      frame: "#fff0c8"
    };

    const player = {
      x: 0,
      y: 0,
      angle: 0,
      speed: 0,
      radius: 16,
      length: 29,
      width: 16,
      maxSpeed: CAR_PHYSICS.playerMaxSpeed,
      reverseSpeed: CAR_PHYSICS.playerReverseSpeed,
      acceleration: CAR_PHYSICS.playerAcceleration,
      brake: CAR_PHYSICS.playerBrake,
      drag: CAR_PHYSICS.playerDrag,
      motionX: 0,
      motionY: 0,
      renderAngle: 0
    };

    const cars = [];
    const policeCars = [];
    const pedestrians = [];
    const blocks = [];
    let carSerial = 0;
    let wantedLevel = 0;
    let hitScore = 0;
    let hitCount = 0;
    let lastHitPoints = 0;
    let survivalTime = 0;
    let noChaseTimer = 0;
    let gameOverTimer = 0;
    let gameOverStartedAt = 0;
    let gameOverFading = false;
    let lastTime = performance.now();

    function resize() {
      const ratio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      minimapCanvas.width = Math.floor(MINIMAP_SIZE * ratio);
      minimapCanvas.height = Math.floor(MINIMAP_SIZE * ratio);
      minimapCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function rand(seed) {
      const n = Math.sin(seed * 127.1 + seed * seed * 0.013) * 43758.5453123;
      return n - Math.floor(n);
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function seededInt(seed, min, max) {
      return min + Math.floor(rand(seed) * (max - min + 1));
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function approach(value, target, amount) {
      if (value < target) return Math.min(target, value + amount);
      if (value > target) return Math.max(target, value - amount);
      return value;
    }

    function smoothstep(t) {
      t = clamp(t, 0, 1);
      return t * t * (3 - 2 * t);
    }

    function normalizeAngle(angle) {
      while (angle >= Math.PI) angle -= 2 * Math.PI;
      while (angle < -Math.PI) angle += 2 * Math.PI;
      return angle;
    }

    function approachAngle(value, target, amount) {
      const diff = normalizeAngle(target - value);
      if (diff > 0) return value + Math.min(diff, amount);
      return value + Math.max(diff, -amount);
    }

    function angleTo(dx, dy) {
      return Math.atan2(dy, dx);
    }

    function blockWorldX(gx) {
      return ROAD + gx * CELL;
    }

    function blockWorldY(gy) {
      return ROAD + gy * CELL;
    }

    function intersectionCenter(ix, iy) {
      return [ix * CELL + ROAD / 2, iy * CELL + ROAD / 2];
    }

    function laneOffset(dx, dy) {
      if (dx > 0) return [0, LANE_WIDTH / 2];
      if (dx < 0) return [0, -LANE_WIDTH / 2];
      if (dy > 0) return [-LANE_WIDTH / 2, 0];
      if (dy < 0) return [LANE_WIDTH / 2, 0];
      return [0, 0];
    }

    function laneNormal(dx, dy) {
      const [ox, oy] = laneOffset(dx, dy);
      const len = Math.hypot(ox, oy) || 1;
      return [ox / len, oy / len];
    }

    function lanePos(fromIX, fromIY, toIX, toIY, t) {
      const [fx, fy] = intersectionCenter(fromIX, fromIY);
      const [tx, ty] = intersectionCenter(toIX, toIY);
      const [ox, oy] = laneOffset(toIX - fromIX, toIY - fromIY);
      return [fx + (tx - fx) * t + ox, fy + (ty - fy) * t + oy];
    }

    function lanePosWithLateral(fromIX, fromIY, toIX, toIY, t, lateral) {
      const [x, y] = lanePos(fromIX, fromIY, toIX, toIY, t);
      const [nx, ny] = laneNormal(toIX - fromIX, toIY - fromIY);
      return [x + nx * lateral, y + ny * lateral];
    }

    function curvedLanePose(fromIX, fromIY, toIX, toIY, progress, lateral, incomingDx, incomingDy) {
      const dx = toIX - fromIX;
      const dy = toIY - fromIY;
      const reversing = incomingDx === -dx && incomingDy === -dy;
      if (reversing && progress < UTURN_ARC) {
        const [cx, cy] = intersectionCenter(fromIX, fromIY);
        const [inOx, inOy] = laneOffset(incomingDx, incomingDy);
        const [startX, startY] = [cx + inOx, cy + inOy];
        const [endX, endY] = lanePosWithLateral(fromIX, fromIY, toIX, toIY, UTURN_ARC, lateral);
        const handle = CELL * 0.26;
        const c1x = startX + incomingDx * handle;
        const c1y = startY + incomingDy * handle;
        const c2x = endX - dx * handle;
        const c2y = endY - dy * handle;
        const t = smoothstep(progress / UTURN_ARC);
        const inv = 1 - t;
        const x = inv * inv * inv * startX + 3 * inv * inv * t * c1x + 3 * inv * t * t * c2x + t * t * t * endX;
        const y = inv * inv * inv * startY + 3 * inv * inv * t * c1y + 3 * inv * t * t * c2y + t * t * t * endY;
        const tx = 3 * inv * inv * (c1x - startX) + 6 * inv * t * (c2x - c1x) + 3 * t * t * (endX - c2x);
        const ty = 3 * inv * inv * (c1y - startY) + 6 * inv * t * (c2y - c1y) + 3 * t * t * (endY - c2y);
        return { x, y, angle: angleTo(tx, ty) };
      }

      const turning = (incomingDx !== dx || incomingDy !== dy) && !reversing;
      if (!turning || progress >= TURN_ARC) {
        const [x, y] = lanePosWithLateral(fromIX, fromIY, toIX, toIY, progress, lateral);
        return { x, y, angle: angleTo(dx, dy) };
      }

      const [cx, cy] = intersectionCenter(fromIX, fromIY);
      const [inOx, inOy] = laneOffset(incomingDx, incomingDy);
      const [startX, startY] = [cx + inOx, cy + inOy];
      const [endX, endY] = lanePosWithLateral(fromIX, fromIY, toIX, toIY, TURN_ARC, lateral);
      const t = smoothstep(progress / TURN_ARC);
      const inv = 1 - t;
      const x = inv * inv * startX + 2 * inv * t * cx + t * t * endX;
      const y = inv * inv * startY + 2 * inv * t * cy + t * t * endY;
      const tx = 2 * inv * (cx - startX) + 2 * t * (endX - cx);
      const ty = 2 * inv * (cy - startY) + 2 * t * (endY - cy);
      return { x, y, angle: angleTo(tx, ty) };
    }

    function nearestIntersection(x, y) {
      return {
        ix: clamp(Math.round((x - ROAD / 2) / CELL), 0, GRID),
        iy: clamp(Math.round((y - ROAD / 2) / CELL), 0, GRID)
      };
    }

    function neighborDirs(ix, iy) {
      const dirs = [];
      if (ix + 1 <= GRID) dirs.push([1, 0]);
      if (iy + 1 <= GRID) dirs.push([0, 1]);
      if (ix - 1 >= 0) dirs.push([-1, 0]);
      if (iy - 1 >= 0) dirs.push([0, -1]);
      return dirs;
    }

    function turnVector(dx, dy, side) {
      return side < 0 ? [dy, -dx] : [-dy, dx];
    }

    function createBlocks() {
      blocks.length = 0;
      for (let gy = 0; gy < GRID; gy++) {
        for (let gx = 0; gx < GRID; gx++) {
          const seed = gy * GRID + gx + 1;
          const police = rand(seed * 4.7) > 0.88;
          const houses = [];
          for (const [hx, hy] of HOUSE_CELLS) {
            const houseSeed = seed * 29 + hx * 7 + hy * 13;
            const isPoliceHouse = police && hy === 2;
            houses.push({
              hx,
              hy,
              floors: seededInt(houseSeed, 4, 7),
              colorIndex: seededInt(houseSeed + 9, 0, palette.roof.length - 1),
              police: isPoliceHouse
            });
          }
          blocks.push({ gx, gy, police, houses });
        }
      }
    }

    function blockAt(gx, gy) {
      if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;
      return blocks[gy * GRID + gx];
    }

    function inBuilding(x, y) {
      if (x < ROAD || y < ROAD) return false;
      const gx = Math.floor((x - ROAD) / CELL);
      const gy = Math.floor((y - ROAD) / CELL);
      if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return false;

      const lx = x - blockWorldX(gx);
      const ly = y - blockWorldY(gy);
      if (lx < 0 || ly < 0 || lx >= BLOCK || ly >= BLOCK) return false;

      const hx = Math.floor(lx / HOUSE);
      const hy = Math.floor(ly / HOUSE);
      if (hx === 1 && hy === 1) return false;

      const inset = 5;
      const localX = lx - hx * HOUSE;
      const localY = ly - hy * HOUSE;
      return localX >= inset && localX <= HOUSE - inset && localY >= inset && localY <= HOUSE - inset;
    }

    function buildingRectAt(x, y) {
      if (x < ROAD || y < ROAD) return null;
      const gx = Math.floor((x - ROAD) / CELL);
      const gy = Math.floor((y - ROAD) / CELL);
      if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;

      const lx = x - blockWorldX(gx);
      const ly = y - blockWorldY(gy);
      if (lx < 0 || ly < 0 || lx >= BLOCK || ly >= BLOCK) return null;

      const hx = Math.floor(lx / HOUSE);
      const hy = Math.floor(ly / HOUSE);
      if (hx === 1 && hy === 1) return null;

      const inset = 5;
      const localX = lx - hx * HOUSE;
      const localY = ly - hy * HOUSE;
      if (localX < inset || localX > HOUSE - inset || localY < inset || localY > HOUSE - inset) return null;

      return {
        x: blockWorldX(gx) + hx * HOUSE + inset,
        y: blockWorldY(gy) + hy * HOUSE + inset,
        w: HOUSE - inset * 2,
        h: HOUSE - inset * 2
      };
    }

    function rectHitsBuilding(cx, cy, length, width, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const halfL = length / 2;
      const halfW = width / 2;
      const points = [];
      for (let ix = -1; ix <= 1; ix++) {
        for (let iy = -1; iy <= 1; iy++) {
          points.push([halfL * ix, halfW * iy]);
        }
      }
      points.push([-halfL * 0.65, -halfW], [halfL * 0.65, -halfW], [-halfL * 0.65, halfW], [halfL * 0.65, halfW]);

      for (const [px, py] of points) {
        const wx = cx + px * cos - py * sin;
        const wy = cy + px * sin + py * cos;
        if (wx < 5 || wy < 5 || wx > WORLD - 5 || wy > WORLD - 5) return true;
        if (inBuilding(wx, wy)) return true;
      }
      return false;
    }

    function pushPlayerOutOfBuilding() {
      let moved = false;
      for (let attempt = 0; attempt < 8; attempt++) {
        const rect = buildingRectAt(player.x, player.y);
        if (!rect && !rectHitsBuilding(player.x, player.y, player.length, player.width, player.angle)) break;

        if (rect) {
          const left = player.x - rect.x;
          const right = rect.x + rect.w - player.x;
          const top = player.y - rect.y;
          const bottom = rect.y + rect.h - player.y;
          const min = Math.min(left, right, top, bottom);
          const margin = player.radius + 3;
          if (min === left) player.x = rect.x - margin;
          else if (min === right) player.x = rect.x + rect.w + margin;
          else if (min === top) player.y = rect.y - margin;
          else player.y = rect.y + rect.h + margin;
          moved = true;
          continue;
        }

        let best = null;
        for (let r = 8; r <= 90 && !best; r += 8) {
          for (let i = 0; i < 16; i++) {
            const a = i / 16 * Math.PI * 2;
            const x = clamp(player.x + Math.cos(a) * r, 8, WORLD - 8);
            const y = clamp(player.y + Math.sin(a) * r, 8, WORLD - 8);
            if (!rectHitsBuilding(x, y, player.length, player.width, player.angle)) {
              best = { x, y };
              break;
            }
          }
        }
        if (!best) break;
        player.x = best.x;
        player.y = best.y;
        moved = true;
      }

      if (moved) player.speed = 0;
    }

    function bfsFirstStep(sIX, sIY, gIX, gIY) {
      if (sIX === gIX && sIY === gIY) return null;
      const n = GRID + 1;
      const key = (x, y) => y * n + x;
      const visited = new Uint8Array(n * n);
      const queue = [];

      visited[key(sIX, sIY)] = 1;
      for (const [dx, dy] of neighborDirs(sIX, sIY)) {
        const nx = sIX + dx;
        const ny = sIY + dy;
        visited[key(nx, ny)] = 1;
        queue.push({ ix: nx, iy: ny, first: [dx, dy] });
      }

      for (let head = 0; head < queue.length; head++) {
        const cur = queue[head];
        if (cur.ix === gIX && cur.iy === gIY) return cur.first;
        for (const [dx, dy] of neighborDirs(cur.ix, cur.iy)) {
          const nx = cur.ix + dx;
          const ny = cur.iy + dy;
          const k = key(nx, ny);
          if (visited[k]) continue;
          visited[k] = 1;
          queue.push({ ix: nx, iy: ny, first: cur.first });
        }
      }
      return null;
    }

    class AICar {
      constructor(isPolice, existing) {
        this.id = carSerial++;
        this.isPolice = isPolice;
        this.color = isPolice ? "#174ea6" : ["#c84836", "#2f8f6b", "#d49a32", "#6c79d8", "#cf5f88", "#c7c0ab", "#3e748f"][Math.floor(Math.random() * 7)];
        this.length = isPolice ? 30 : 27;
        this.width = 15;
        this.radius = isPolice ? 17 : 16;
        this.maxSpeed = isPolice ? CAR_PHYSICS.policeMaxSpeed : CAR_PHYSICS.regularSpeed;
        this.baseSpeed = isPolice ? CAR_PHYSICS.policeCruiseSpeed : CAR_PHYSICS.regularSpeed;
        this.chaseSpeed = isPolice ? CAR_PHYSICS.policeMaxSpeed : CAR_PHYSICS.regularSpeed;
        this.speed = this.baseSpeed;
        this.motionX = 0;
        this.motionY = 0;
        this.renderAngle = 0;
        this.chasing = false;
        this.chaseClosedIn = false;
        this.playerHitCooldown = 0;
        this.blockedTime = 0;
        this.stuckTime = 0;
        this.yieldTimer = 0;
        this.rightOfWayTimer = 0;
        this.overtakeTimer = 0;
        this.overtakeUrgent = false;
        this.emergencyTimer = 0;
        this.reverseTimer = 0;
        this.hitStopTimer = 0;
        this.lateralOffset = 0;
        this.targetLateral = 0;
        this.blocksUntilTurn = randInt(2, 5);
        this.turnSide = Math.random() < 0.5 ? -1 : 1;
        this.lastDx = 1;
        this.lastDy = 0;
        this.progress = 0;
        this.fromIX = 0;
        this.fromIY = 0;
        this.toIX = 1;
        this.toIY = 0;
        this.pushX = 0;
        this.pushY = 0;
        this.pushVX = 0;
        this.pushVY = 0;

        for (let attempt = 0; attempt < 100; attempt++) {
          const ix = randInt(0, GRID);
          const iy = randInt(0, GRID);
          const dirs = neighborDirs(ix, iy);
          if (!dirs.length) continue;
          const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
          this.fromIX = ix;
          this.fromIY = iy;
          this.toIX = ix + dx;
          this.toIY = iy + dy;
          this.lastDx = dx;
          this.lastDy = dy;
          this.progress = 0.06 + Math.random() * 0.88;
          this.refreshPosition();
          this.angle = this.targetAngle;
          this.renderAngle = this.angle;
          const clear = existing.every(car => Math.hypot(car.x - this.x, car.y - this.y) > 48);
          if (clear) return;
        }
        this.angle = this.targetAngle;
        this.renderAngle = this.angle;
      }

      refreshPosition() {
        const pose = curvedLanePose(this.fromIX, this.fromIY, this.toIX, this.toIY, this.progress, this.lateralOffset, this.lastDx, this.lastDy);
        this.targetAngle = pose.angle;
        if (this.angle === undefined) this.angle = this.targetAngle;
        let pushX = this.pushX;
        let pushY = this.pushY;
        let x = pose.x + pushX;
        let y = pose.y + pushY;

        for (let attempt = 0; attempt < 8 && rectHitsBuilding(x, y, this.length, this.width, this.angle); attempt++) {
          pushX *= 0.45;
          pushY *= 0.45;
          x = pose.x + pushX;
          y = pose.y + pushY;
        }

        if (rectHitsBuilding(x, y, this.length, this.width, this.angle)) {
          pushX = 0;
          pushY = 0;
          this.pushVX = 0;
          this.pushVY = 0;
          x = pose.x;
          y = pose.y;
        }

        this.pushX = pushX;
        this.pushY = pushY;
        this.x = x;
        this.y = y;
      }

      updatePush(dt) {
        if (!this.pushX && !this.pushY && !this.pushVX && !this.pushVY) return;
        this.pushX += this.pushVX * dt;
        this.pushY += this.pushVY * dt;
        const friction = Math.exp(-4 * dt);
        this.pushVX *= friction;
        this.pushVY *= friction;
        const recovery = Math.exp(-2.8 * dt);
        this.pushX *= recovery;
        this.pushY *= recovery;
        const max = 32;
        const mag = Math.hypot(this.pushX, this.pushY);
        if (mag > max) {
          this.pushX = this.pushX / mag * max;
          this.pushY = this.pushY / mag * max;
        }
        if (Math.abs(this.pushX) < 0.1) this.pushX = 0;
        if (Math.abs(this.pushY) < 0.1) this.pushY = 0;
        if (Math.abs(this.pushVX) < 0.5) this.pushVX = 0;
        if (Math.abs(this.pushVY) < 0.5) this.pushVY = 0;
      }

      updateAngle(dt) {
        if (this.targetAngle === undefined) return;
        const diff = normalizeAngle(this.targetAngle - this.angle);
        const maxRate = CAR_PHYSICS.aiTurnRate;
        if (diff > 0) this.angle += Math.min(diff, maxRate * dt);
        else this.angle += Math.max(diff, -maxRate * dt);
      }

      updateMotionVector(prevX, prevY, dt) {
        if (dt <= 0) return;
        const vx = (this.x - prevX) / dt;
        const vy = (this.y - prevY) / dt;
        this.motionX = vx;
        this.motionY = vy;
      }

      useLaneChangeHeading(prevProgress, prevLateral, dt) {
        if (dt <= 0) return false;
        const lateralDelta = this.lateralOffset - prevLateral;
        const progressDelta = this.progress - prevProgress;
        if (Math.abs(lateralDelta) < 0.15 || progressDelta < -0.0005) return false;
        if (Math.hypot(this.motionX || 0, this.motionY || 0) <= CAR_PHYSICS.renderMinVectorSpeed) return false;
        this.targetAngle = angleTo(this.motionX, this.motionY);
        return true;
      }

      angleAlignFactor() {
        if (this.targetAngle === undefined) return 1;
        const diff = normalizeAngle(this.targetAngle - this.angle);
        const absDiff = Math.abs(diff);
        if (absDiff < 0.3) return 1;
        return Math.max(0.25, 1 - (absDiff - 0.3) * 0.55);
      }

      sameSegment(other) {
        return this.fromIX === other.fromIX && this.fromIY === other.fromIY && this.toIX === other.toIX && this.toIY === other.toIY;
      }

      sameTrafficLane(other) {
        return this.sameSegment(other) && Math.abs(this.lateralOffset - other.lateralOffset) < 18;
      }

      continuesInto(other) {
        const dx = this.toIX - this.fromIX;
        const dy = this.toIY - this.fromIY;
        return this.toIX === other.fromIX
          && this.toIY === other.fromIY
          && other.toIX - other.fromIX === dx
          && other.toIY - other.fromIY === dy
          && Math.abs(this.lateralOffset - other.lateralOffset) < 18;
      }

      nextIntersectionKey() {
        return `${this.toIX},${this.toIY}`;
      }

      intersectionPriority(other) {
        if (this.chasing !== other.chasing) return this.chasing ? -1 : 1;
        if (this.isPolice !== other.isPolice) return this.isPolice ? -1 : 1;
        return this.id - other.id;
      }

      shouldYieldTo(other) {
        if (this.sameSegment(other)) return this.sameTrafficLane(other) && other.progress > this.progress;
        if (this.continuesInto(other)) return this.progress > 0.8 && other.progress < 0.24;

        if (this.blockedTime > 0.8) return false;
        if (other.blockedTime > 0.8 && (other.progress > 0.94 || other.progress < 0.08)) return false;

        const thisInIntersection = this.progress > 0.9 || this.progress < 0.1;
        const otherInIntersection = other.progress > 0.9 || other.progress < 0.1;
        if (thisInIntersection && !otherInIntersection) return false;
        if (!thisInIntersection && otherInIntersection) return true;
        if (this.nextIntersectionKey() !== other.nextIntersectionKey()) return false;

        return this.intersectionPriority(other) > 0;
      }

      blockedInfo(allCars, player, lateral = this.lateralOffset, lookAhead = 0.085) {
        const checks = [lookAhead, lookAhead + 0.07, lookAhead + 0.15, lookAhead + 0.24];
        for (const ahead of checks) {
          const step = Math.min(0.98, this.progress + ahead);
          const pose = curvedLanePose(this.fromIX, this.fromIY, this.toIX, this.toIY, step, lateral, this.lastDx, this.lastDy);
          const clearance = ahead > 0.18 ? 26 : 31;

          for (const other of allCars) {
            if (other === this) continue;
            const d = Math.hypot(other.x - pose.x, other.y - pose.y);
            if (d > clearance) continue;
            if (this.shouldYieldTo(other)) return { blocked: true, blocker: other };
          }

          if (Math.hypot(player.x - pose.x, player.y - pose.y) < clearance + 2) {
            return { blocked: true, blocker: player };
          }
        }

        return { blocked: false, blocker: null };
      }

      blockedByCar(allCars, player) {
        return this.blockedInfo(allCars, player).blocked;
      }

      overtakeIsSafe(allCars, player, passingLateral = -LANE_WIDTH, emergency = false, ignorePlayer = false) {
        if (!emergency && (this.progress < 0.2 || this.progress > 0.62)) return false;
        if (emergency && (this.progress < 0.08 || this.progress > 0.84)) return false;

        for (const lookAhead of [0.03, 0.09, 0.16, 0.25, 0.34]) {
          const t = Math.min(0.96, this.progress + lookAhead);
          const pose = curvedLanePose(this.fromIX, this.fromIY, this.toIX, this.toIY, t, passingLateral, this.lastDx, this.lastDy);
          if (rectHitsBuilding(pose.x, pose.y, this.length, this.width, this.angle)) return false;
          if (!ignorePlayer && Math.hypot(player.x - pose.x, player.y - pose.y) < 34) return false;
          for (const other of allCars) {
            if (other === this) continue;
            if (Math.hypot(other.x - pose.x, other.y - pose.y) < 34) return false;
          }
        }

        return true;
      }

      chaseLaneScore(allCars, player, lateral) {
        const playerVx = player.motionX || Math.cos(player.angle) * (player.speed || 0);
        const playerVy = player.motionY || Math.sin(player.angle) * (player.speed || 0);
        const distanceToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
        const leadSeconds = clamp(distanceToPlayer / Math.max(1, this.chaseSpeed), 0, 1.25);
        const targetX = player.x + playerVx * leadSeconds * 0.35;
        const targetY = player.y + playerVy * leadSeconds * 0.35;
        let routeScore = Infinity;
        let trafficPenalty = 0;

        for (const lookAhead of [0.04, 0.11, 0.2, 0.32, 0.48, 0.64]) {
          const t = Math.min(0.96, this.progress + lookAhead);
          const pose = curvedLanePose(this.fromIX, this.fromIY, this.toIX, this.toIY, t, lateral, this.lastDx, this.lastDy);
          if (rectHitsBuilding(pose.x, pose.y, this.length, this.width, pose.angle)) return Infinity;

          const futureDistance = Math.hypot(targetX - pose.x, targetY - pose.y);
          routeScore = Math.min(routeScore, futureDistance + lookAhead * CELL * 0.15);

          for (const other of allCars) {
            if (other === this) continue;
            const clearance = other.isPolice && other.chasing ? 30 : 42;
            const d = Math.hypot(other.x - pose.x, other.y - pose.y);
            if (d < clearance) trafficPenalty += (clearance - d) * (lookAhead < 0.16 ? 2.6 : 1.1);
          }
        }

        const laneChangePenalty = Math.abs(lateral - this.lateralOffset) * 0.22;
        return routeScore + trafficPenalty + laneChangePenalty;
      }

      pickChaseLateral(allCars, player) {
        if (this.progress > 0.82) return 0;

        let bestLateral = 0;
        let bestScore = Infinity;

        for (const lateral of POLICE_CHASE_LANES) {
          const score = this.chaseLaneScore(allCars, player, lateral);
          if (score < bestScore) {
            bestScore = score;
            bestLateral = lateral;
          }
        }

        return bestLateral;
      }

      policeNeedsRightOfWay(allCars) {
        if (this.isPolice) return false;
        for (const police of allCars) {
          if (!police.isPolice || !police.chasing) continue;
          if (police.sameSegment(this) && police.progress < this.progress && this.progress - police.progress < 0.44) {
            return true;
          }
          if (police.continuesInto(this) && police.progress > 0.7 && this.progress < 0.34) {
            return true;
          }
          if (Math.hypot(police.x - this.x, police.y - this.y) < 92) {
            const policeVx = Math.cos(police.angle);
            const policeVy = Math.sin(police.angle);
            const toCarX = this.x - police.x;
            const toCarY = this.y - police.y;
            if (policeVx * toCarX + policeVy * toCarY > 0) return true;
          }
        }
        return false;
      }

      tryEscapeFromIntersection(allCars, player, force = false) {
        if ((!force && this.progress > 0.08) || (force && this.progress > 0.18) || (!force && this.blockedTime < 2) || this.chasing) return false;

        const dirs = neighborDirs(this.fromIX, this.fromIY)
          .filter(([dx, dy]) => this.fromIX + dx !== this.toIX || this.fromIY + dy !== this.toIY)
          .filter(([dx, dy]) => dx !== -this.lastDx || dy !== -this.lastDy);

        for (const [dx, dy] of dirs) {
          const nx = this.fromIX + dx;
          const ny = this.fromIY + dy;
          let clear = true;
          for (const t of [0.1, 0.22, 0.34]) {
            const [x, y] = lanePosWithLateral(this.fromIX, this.fromIY, nx, ny, t, 0);
            if (Math.hypot(player.x - x, player.y - y) < 36) {
              clear = false;
              break;
            }
            for (const other of allCars) {
              if (other === this) continue;
              if (Math.hypot(other.x - x, other.y - y) < 36) {
                clear = false;
                break;
              }
            }
            if (!clear) break;
          }

          if (!clear) continue;
          this.toIX = nx;
          this.toIY = ny;
          this.progress = 0.08;
          this.lateralOffset = 0;
          this.targetLateral = 0;
          this.overtakeTimer = 0;
          this.overtakeUrgent = false;
          this.emergencyTimer = 0;
          this.reverseTimer = 0;
          this.blockedTime = 0;
          this.stuckTime = 0;
          this.refreshPosition();
          return true;
        }

        return false;
      }

      tryUTurn(allCars, player, force = false) {
        if (this.chasing) return false;
        if (!force && this.blockedTime < 1.4) return false;
        if ((!force && (this.progress < 0.18 || this.progress > 0.78)) || (force && (this.progress < 0.08 || this.progress > 0.9))) return false;

        if (!force) {
          for (const other of allCars) {
            if (other === this) continue;
            if (other.sameTrafficLane && other.sameTrafficLane(this) && other.progress < this.progress) return false;
          }
        }

        const newFromIX = this.toIX;
        const newFromIY = this.toIY;
        const newToIX = this.fromIX;
        const newToIY = this.fromIY;
        const newProgress = 1 - this.progress;

        for (const lookAhead of [0, 0.1, 0.22, 0.34]) {
          const t = Math.min(0.96, newProgress + lookAhead);
          const [x, y] = lanePosWithLateral(newFromIX, newFromIY, newToIX, newToIY, t, 0);
          if (rectHitsBuilding(x, y, this.length, this.width, this.angle)) return false;
          if (Math.hypot(player.x - x, player.y - y) < 36) return false;
          for (const other of allCars) {
            if (other === this) continue;
            if (Math.hypot(other.x - x, other.y - y) < (force ? 27 : 32)) return false;
          }
        }

        this.lastDx = newToIX - newFromIX;
        this.lastDy = newToIY - newFromIY;
        this.fromIX = newFromIX;
        this.fromIY = newFromIY;
        this.toIX = newToIX;
        this.toIY = newToIY;
        this.progress = newProgress;
        this.lateralOffset = 0;
        this.targetLateral = 0;
        this.overtakeTimer = 0;
        this.overtakeUrgent = false;
        this.emergencyTimer = 0;
        this.reverseTimer = 0;
        this.blockedTime = 0;
        this.stuckTime = 0;
        this.refreshPosition();
        return true;
      }

      rearIsClear(allCars, player) {
        for (const lookBack of [0.05, 0.12, 0.2]) {
          const t = Math.max(0.02, this.progress - lookBack);
          const pose = curvedLanePose(this.fromIX, this.fromIY, this.toIX, this.toIY, t, this.lateralOffset, this.lastDx, this.lastDy);
          if (rectHitsBuilding(pose.x, pose.y, this.length, this.width, this.angle)) return false;
          if (Math.hypot(player.x - pose.x, player.y - pose.y) < 35) return false;
          for (const other of allCars) {
            if (other === this) continue;
            if (Math.hypot(other.x - pose.x, other.y - pose.y) < 32) return false;
          }
        }
        return true;
      }

      tryEmergencyEscape(allCars, player) {
        if (this.hitStopTimer > 0 || this.stuckTime < STUCK_ESCAPE_SECONDS) return false;
        if (this.overtakeIsSafe(allCars, player, -LANE_WIDTH, true)) {
          this.emergencyTimer = 2.6;
          this.overtakeTimer = 2.6;
          this.overtakeUrgent = true;
          this.stuckTime = STUCK_ESCAPE_SECONDS * 0.7;
          return true;
        }

        if (this.tryEscapeFromIntersection(allCars, player, true)) return true;
        if (this.tryUTurn(allCars, player, true)) return true;

        if (this.rearIsClear(allCars, player)) {
          this.reverseTimer = 1.2;
          this.overtakeTimer = 0;
          this.overtakeUrgent = false;
          this.targetLateral = 0;
          this.stuckTime = STUCK_ESCAPE_SECONDS * 0.7;
          return true;
        }

        return false;
      }

      update(dt, allCars, player) {
        if (this.playerHitCooldown > 0) this.playerHitCooldown = Math.max(0, this.playerHitCooldown - dt);
        const prevX = this.x;
        const prevY = this.y;

        if (this.hitStopTimer > 0) {
          this.hitStopTimer = Math.max(0, this.hitStopTimer - dt);
          this.speed = approach(this.speed, 0, CAR_PHYSICS.aiBrake * dt);
          this.yieldTimer = Math.max(this.yieldTimer, this.hitStopTimer);
          this.updatePush(dt);
          this.targetLateral = 0;
          this.lateralOffset += (0 - this.lateralOffset) * Math.min(1, 3.5 * dt);
          this.refreshPosition();
          this.updateMotionVector(prevX, prevY, dt);
          this.useLaneChangeHeading(this.progress, this.lateralOffset, dt);
          this.updateAngle(dt);
          updateCarRenderAngle(this, this.motionX || 0, this.motionY || 0, dt);
          return;
        }

        if (this.yieldTimer > 0) this.yieldTimer -= dt;
        if (this.rightOfWayTimer > 0) this.rightOfWayTimer -= dt;
        if (this.overtakeTimer > 0) this.overtakeTimer -= dt;
        if (this.emergencyTimer > 0) this.emergencyTimer -= dt;
        if (this.overtakeTimer <= 0) this.overtakeUrgent = false;
        if (this.reverseTimer > 0) this.reverseTimer -= dt;
        this.updatePush(dt);
        if (this.policeNeedsRightOfWay(allCars)) {
          this.rightOfWayTimer = Math.max(this.rightOfWayTimer, 0.8);
          this.yieldTimer = Math.max(this.yieldTimer, 0.5);
        }
        const targetSpeed = clamp(this.chasing ? this.chaseSpeed : this.baseSpeed, 0, this.maxSpeed);
        const rate = targetSpeed > this.speed ? CAR_PHYSICS.aiAcceleration : CAR_PHYSICS.aiBrake;
        this.speed = approach(this.speed, targetSpeed, rate * dt);
        const alignFactor = this.angleAlignFactor();
        const progressStep = this.speed > CAR_PHYSICS.renderMinVectorSpeed ? this.speed * dt / CELL * alignFactor : 0;
        const info = this.blockedInfo(allCars, player);
        const blocked = info.blocked;
        this.blockedTime = blocked ? this.blockedTime + dt : 0;
        this.stuckTime = blocked ? this.stuckTime + dt : Math.max(0, this.stuckTime - dt * 2);
        if (this.tryEmergencyEscape(allCars, player)) {
          this.updateAngle(dt);
          return;
        }

        const chasingPolice = this.isPolice && this.chasing;
        const blockedByPlayer = info.blocker === player;
        const urgentPass = chasingPolice || blockedByPlayer;
        const canPass = blocked
          && (!blockedByPlayer || this.blockedTime > 0.35 || chasingPolice)
          && this.overtakeIsSafe(allCars, player, -LANE_WIDTH, urgentPass, chasingPolice);
        const midBlockJam = blocked && !canPass && !this.chasing && this.progress > 0.14 && this.progress < 0.82;
        const impatient = this.blockedTime > (this.isPolice ? 0.45 : 0.9) && !midBlockJam;

        if (blocked && (this.tryEscapeFromIntersection(allCars, player) || this.tryUTurn(allCars, player))) {
          this.updateAngle(dt);
          return;
        }

        if (canPass && this.blockedTime > (chasingPolice ? 0.12 : 0.35)) {
          this.overtakeTimer = chasingPolice ? 1.75 : 1.25;
          this.overtakeUrgent = urgentPass;
        }

        const activeUrgentPass = this.overtakeTimer > 0 && this.overtakeUrgent;
        const mergeProgress = activeUrgentPass ? 0.82 : (chasingPolice ? 0.74 : 0.62);
        const mustMergeBack = !chasingPolice && (
          this.progress > mergeProgress
          || (this.overtakeTimer > 0 && !this.overtakeIsSafe(allCars, player, -LANE_WIDTH, activeUrgentPass || chasingPolice, chasingPolice))
        );
        if (mustMergeBack) {
          this.overtakeTimer = 0;
          this.overtakeUrgent = false;
        }
        if (this.progress > 0.74) this.emergencyTimer = 0;
        this.targetLateral = chasingPolice
          ? this.pickChaseLateral(allCars, player)
          : (this.overtakeTimer > 0 || this.emergencyTimer > 0 ? -LANE_WIDTH : (this.rightOfWayTimer > 0 ? 10 : 0));
        const lateralStep = 82 * dt;
        const prevProgress = this.progress;
        const prevLateral = this.lateralOffset;
        if (this.lateralOffset < this.targetLateral) {
          this.lateralOffset = Math.min(this.targetLateral, this.lateralOffset + lateralStep);
        } else if (this.lateralOffset > this.targetLateral) {
          this.lateralOffset = Math.max(this.targetLateral, this.lateralOffset - lateralStep);
        }

        const mergingBeforeIntersection = this.targetLateral === 0 && this.progress > 0.66 && Math.abs(this.lateralOffset) > 3;

        if (mergingBeforeIntersection) {
          this.progress = Math.min(0.88, this.progress + progressStep * 0.22);
        } else if (this.reverseTimer > 0) {
          this.progress = Math.max(0.03, this.progress - progressStep * 0.85);
        } else if (!blocked || this.chasing || impatient || this.overtakeTimer > 0) {
          this.progress += progressStep * (this.yieldTimer > 0 ? 0.35 : 1);
          if (impatient) this.blockedTime = Math.min(this.blockedTime, 0.5);
        } else if (this.progress > 0.82) {
          this.progress += progressStep * 0.28;
        } else if (this.blockedTime > 0.8) {
          this.progress = Math.max(0.04, this.progress - progressStep * 0.7);
        } else {
          this.progress = Math.max(0.02, this.progress - progressStep * 0.04);
        }

        while (this.progress >= 1) {
          this.progress -= 1;
          this.lastDx = this.toIX - this.fromIX;
          this.lastDy = this.toIY - this.fromIY;
          this.fromIX = this.toIX;
          this.fromIY = this.toIY;
          this.lateralOffset = 0;
          this.targetLateral = 0;
          this.overtakeTimer = 0;
          this.overtakeUrgent = false;
          this.emergencyTimer = 0;
          this.reverseTimer = 0;
          this.stuckTime = 0;
          this.pickNextDirection(player);
        }
        this.refreshPosition();
        this.updateMotionVector(prevX, prevY, dt);
        this.useLaneChangeHeading(prevProgress, prevLateral, dt);
        this.updateAngle(dt);
        updateCarRenderAngle(this, this.motionX || 0, this.motionY || 0, dt);
      }

      pickNextDirection(player) {
        let chosen = null;

        if (this.chasing && this.isPolice) {
          const goal = nearestIntersection(player.x, player.y);
          chosen = this.pickChaseDirection(goal.ix, goal.iy, player);
        }

        const dirs = neighborDirs(this.fromIX, this.fromIY);
        const noUTurn = dirs.filter(([dx, dy]) => !(dx === -this.lastDx && dy === -this.lastDy));
        const candidates = noUTurn.length ? noUTurn : dirs;

        if (!chosen) {
          this.blocksUntilTurn--;
          if (this.blocksUntilTurn <= 0) {
            const rightOrLeft = turnVector(this.lastDx, this.lastDy, this.turnSide);
            const alternate = turnVector(this.lastDx, this.lastDy, -this.turnSide);
            chosen = candidates.find(([dx, dy]) => dx === rightOrLeft[0] && dy === rightOrLeft[1])
              || candidates.find(([dx, dy]) => dx === alternate[0] && dy === alternate[1])
              || null;
            this.blocksUntilTurn = randInt(4, 5);
            this.turnSide *= -1;
          }
        }

        if (!chosen) {
          chosen = candidates.find(([dx, dy]) => dx === this.lastDx && dy === this.lastDy)
            || candidates[Math.floor(Math.random() * candidates.length)];
        }

        this.toIX = this.fromIX + chosen[0];
        this.toIY = this.fromIY + chosen[1];
      }

      pickChaseDirection(goalIX, goalIY, player) {
        const dirs = neighborDirs(this.fromIX, this.fromIY);
        let best = null;
        let bestScore = Infinity;

        for (const [dx, dy] of dirs) {
          const nx = this.fromIX + dx;
          const ny = this.fromIY + dy;
          const routeDistance = Math.abs(goalIX - nx) + Math.abs(goalIY - ny);
          const [ix, iy] = intersectionCenter(nx, ny);
          const directDistance = Math.hypot(player.x - ix, player.y - iy) / CELL;
          const reversing = dx === -this.lastDx && dy === -this.lastDy;
          const turnCost = dx === this.lastDx && dy === this.lastDy ? 0 : (reversing ? 0.08 : 0.04);
          const score = routeDistance * 10 + directDistance + turnCost;
          if (score < bestScore) {
            bestScore = score;
            best = [dx, dy];
          }
        }

        return best || bfsFirstStep(this.fromIX, this.fromIY, goalIX, goalIY);
      }
    }

    function createTraffic() {
      cars.length = 0;
      policeCars.length = 0;
      carSerial = 0;
      for (let i = 0; i < TOTAL_CARS - POLICE_COUNT; i++) {
        cars.push(new AICar(false, cars));
      }
      for (let i = 0; i < POLICE_COUNT; i++) {
        const car = new AICar(true, cars);
        cars.push(car);
        policeCars.push(car);
      }
    }

    function createPedestrians() {
      pedestrians.length = 0;
      for (let i = 0; i < 90; i++) {
        const gx = randInt(0, GRID - 1);
        const gy = randInt(0, GRID - 1);
        pedestrians.push({
          gx,
          gy,
          t: Math.random() * 4,
          speed: 0.15 + Math.random() * 0.18,
          color: ["#efe6cc", "#425c8a", "#a63c40", "#2d7158", "#d7a047"][i % 5]
        });
      }
    }

    function pedestrianPosition(ped) {
      const x = blockWorldX(ped.gx);
      const y = blockWorldY(ped.gy);
      const inset = 12;
      const side = Math.floor(ped.t) % 4;
      const f = ped.t - Math.floor(ped.t);
      if (side === 0) return [x + inset + f * (BLOCK - inset * 2), y + inset];
      if (side === 1) return [x + BLOCK - inset, y + inset + f * (BLOCK - inset * 2)];
      if (side === 2) return [x + BLOCK - inset - f * (BLOCK - inset * 2), y + BLOCK - inset];
      return [x + inset, y + BLOCK - inset - f * (BLOCK - inset * 2)];
    }

    function placePlayer() {
      const ix = Math.floor(GRID / 2);
      const iy = Math.floor(GRID / 2);
      const [x, y] = lanePos(ix, iy, ix + 1, iy, 0.35);
      player.x = x;
      player.y = y;
      player.angle = 0;
      player.speed = 0;
    }

    function activeChaseCount() {
      return policeCars.reduce((sum, police) => sum + (police.chasing ? 1 : 0), 0);
    }

    function syncWantedLevel() {
      wantedLevel = activeChaseCount();
    }

    function restartGame() {
      wantedLevel = 0;
      hitScore = 0;
      hitCount = 0;
      lastHitPoints = 0;
      survivalTime = 0;
      noChaseTimer = 0;
      gameOverTimer = 0;
      gameOverStartedAt = 0;
      gameOverFading = false;
      keys.clear();
      document.body.classList.remove("game-over");
      document.body.classList.remove("game-over-fade");
      messageEl.classList.remove("game-over");
      messageEl.style.display = "none";
      messageEl.textContent = "";
      createBlocks();
      createPedestrians();
      createTraffic();
      placePlayer();
    }

    function startGameOver() {
      if (gameOverTimer > 0) return;
      player.speed = 0;
      gameOverTimer = GAME_OVER_SECONDS;
      gameOverStartedAt = performance.now();
      gameOverFading = false;
      messageEl.textContent = "Game Over!";
      messageEl.classList.add("game-over");
      messageEl.style.display = "block";
      document.body.classList.add("game-over");
      document.body.classList.remove("game-over-fade");
    }

    function activatePolice(police) {
      police.chasing = true;
      police.chaseClosedIn = false;
      police.hitStopTimer = 0;
      police.yieldTimer = 0;
      police.rightOfWayTimer = 0;
      police.overtakeTimer = 0;
      police.emergencyTimer = 0;
      police.reverseTimer = 0;
      police.targetLateral = 0;
      noChaseTimer = 0;
    }

    function activateNearestPolice() {
      let best = null;
      let bestD = Infinity;
      for (const police of policeCars) {
        if (police.chasing) continue;
        const d = Math.hypot(police.x - player.x, police.y - player.y);
        if (d < bestD) {
          bestD = d;
          best = police;
        }
      }
      if (!best) return false;
      activatePolice(best);
      return true;
    }

    function activateRandomDistantPolice() {
      const candidates = policeCars.filter(police => {
        if (police.chasing) return false;
        return Math.hypot(police.x - player.x, police.y - player.y) >= RANDOM_CHASE_MIN_DISTANCE;
      });
      if (!candidates.length) return false;

      activatePolice(candidates[Math.floor(Math.random() * candidates.length)]);
      return true;
    }

    function reportPlayerHit(car) {
      lastHitPoints = activeChaseCount() + 1;
      hitScore += lastHitPoints;
      hitCount++;
      if (activateNearestPolice()) syncWantedLevel();
    }

    function playerHitPoliceFront(car, dirX, dirY, dotV) {
      if (!car.isPolice || dotV <= 16) return false;
      const carToPlayerX = -dirX;
      const carToPlayerY = -dirY;
      const frontDot = Math.cos(car.angle) * carToPlayerX + Math.sin(car.angle) * carToPlayerY;
      return frontDot > POLICE_FRONT_HIT_DOT;
    }

    function updatePoliceChases() {
      let changed = false;
      for (const police of policeCars) {
        if (!police.chasing) continue;
        const distance = Math.hypot(police.x - player.x, police.y - player.y);
        if (distance <= CHASE_CLOSE_DISTANCE) police.chaseClosedIn = true;
        if (!police.chaseClosedIn || distance <= CHASE_LOST_DISTANCE) continue;
        police.chasing = false;
        police.chaseClosedIn = false;
        police.overtakeTimer = 0;
        police.emergencyTimer = 0;
        police.targetLateral = 0;
        changed = true;
      }
      if (changed) syncWantedLevel();
    }

    function updateNoChaseTimer(dt) {
      if (activeChaseCount() > 0) {
        noChaseTimer = 0;
        return;
      }

      noChaseTimer += dt;
      if (noChaseTimer < NO_CHASE_REST_SECONDS) return;
      if (activateRandomDistantPolice()) syncWantedLevel();
    }

    function updatePlayer(dt) {
      const prevX = player.x;
      const prevY = player.y;
      pushPlayerOutOfBuilding();

      if (keys.has("ArrowUp")) {
        player.speed += player.acceleration * dt;
      } else if (keys.has("ArrowDown")) {
        player.speed -= player.brake * dt;
      } else {
        player.speed *= Math.pow(player.drag, dt * 60);
        if (Math.abs(player.speed) < 4) player.speed = 0;
      }

      player.speed = clamp(player.speed, player.reverseSpeed, player.maxSpeed);

      const turn = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
      const moving = Math.abs(player.speed) > CAR_PHYSICS.playerMinMoveSpeed;
      if (moving) {
        const steer = (1.35 + Math.min(Math.abs(player.speed) / player.maxSpeed, 1) * 1.35) * dt;
        player.angle += turn * steer * Math.sign(player.speed);

        const distance = Math.abs(player.speed) * dt;
        const steps = Math.max(1, Math.ceil(distance / 7));
        for (let step = 0; step < steps; step++) {
          const dx = Math.cos(player.angle) * player.speed * dt / steps;
          const dy = Math.sin(player.angle) * player.speed * dt / steps;
          const nextX = player.x + dx;
          const nextY = player.y + dy;

          if (!rectHitsBuilding(nextX, nextY, player.length, player.width, player.angle)) {
            player.x = nextX;
            player.y = nextY;
          } else if (!rectHitsBuilding(player.x + dx, player.y, player.length, player.width, player.angle)) {
            player.x += dx;
            player.speed *= 0.55;
          } else if (!rectHitsBuilding(player.x, player.y + dy, player.length, player.width, player.angle)) {
            player.y += dy;
            player.speed *= 0.55;
          } else {
            player.speed *= -0.18;
            break;
          }
        }
      } else {
        player.speed = 0;
      }

      player.x = clamp(player.x, 8, WORLD - 8);
      player.y = clamp(player.y, 8, WORLD - 8);
      pushPlayerOutOfBuilding();
      if (dt > 0) {
        player.motionX = (player.x - prevX) / dt;
        player.motionY = (player.y - prevY) / dt;
        updateCarRenderAngle(player, player.motionX, player.motionY, dt);
      }
    }

    function aiMotionVector(car) {
      const routeSign = car.reverseTimer > 0 ? -0.85 : 1;
      const routeSpeed = car.hitStopTimer > 0 ? 0 : (car.speed || 0) * routeSign;
      return {
        x: Math.cos(car.angle) * routeSpeed + car.pushVX,
        y: Math.sin(car.angle) * routeSpeed + car.pushVY
      };
    }

    function addCarImpact(car, nx, ny, overlap, impulse) {
      car.pushX += nx * overlap;
      car.pushY += ny * overlap;
      car.pushVX += nx * impulse;
      car.pushVY += ny * impulse;
      car.yieldTimer = Math.max(car.yieldTimer, 0.35);
      car.blockedTime = Math.max(car.blockedTime, 0.4);
    }

    function applyAICarImpact(a, b, nx, ny, overlap) {
      const av = aiMotionVector(a);
      const bv = aiMotionVector(b);
      const closing = (av.x - bv.x) * nx + (av.y - bv.y) * ny;
      const impulse = Math.max(18, Math.abs(closing) * 0.45);
      addCarImpact(a, -nx, -ny, overlap * 0.38, impulse * 0.42);
      addCarImpact(b, nx, ny, overlap * 0.38, impulse * 0.42);
      a.overtakeTimer = 0;
      b.overtakeTimer = 0;
      a.refreshPosition();
      b.refreshPosition();
    }

    function resolveCarPair(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.max(0.001, Math.hypot(dx, dy));
      const minD = (a.radius || 13) + (b.radius || 13);
      if (d >= minD) return false;

      const overlap = minD - d;
      const nx = dx / d;
      const ny = dy / d;

      if (a === player || b === player) {
        const car = a === player ? b : a;
        const previousBlockedTime = car.blockedTime || 0;
        const previousStuckTime = car.stuckTime || 0;
        const impactSpeed = Math.abs(player.speed);
        const dirX = a === player ? nx : -nx;
        const dirY = a === player ? ny : -ny;
        const playerShare = 0.35;
        const carShare = 0.65;
        player.x -= dirX * overlap * playerShare;
        player.y -= dirY * overlap * playerShare;
        car.pushX += dirX * overlap * carShare;
        car.pushY += dirY * overlap * carShare;
        const playerVx = Math.cos(player.angle) * player.speed;
        const playerVy = Math.sin(player.angle) * player.speed;
        const dotV = playerVx * dirX + playerVy * dirY;
        const carV = aiMotionVector(car);
        const policeTowardPlayer = carV.x * -dirX + carV.y * -dirY;
        const closingFromPolice = (carV.x - playerVx) * -dirX + (carV.y - playerVy) * -dirY;
        const policeCapturedPlayer = car.isPolice && car.chasing && policeTowardPlayer > 38 && closingFromPolice > 18;
        const policeFrontCrash = playerHitPoliceFront(car, dirX, dirY, dotV);
        const hitForce = Math.max(30, Math.abs(dotV));
        if (dotV > 0) {
          const transfer = 0.72;
          car.pushVX += hitForce * transfer * dirX;
          car.pushVY += hitForce * transfer * dirY;
        }
        car.refreshPosition();
        player.speed *= impactSpeed > 90 ? -0.12 : 0.38;
        if (!car.isPolice || !car.chasing) {
          const recoverySeconds = dotV > 12 ? Math.min(HIT_STOP_SECONDS, 0.25 + dotV / 140) : 0;
          if (recoverySeconds > 0) {
            car.hitStopTimer = Math.max(car.hitStopTimer, recoverySeconds);
            car.yieldTimer = Math.max(car.yieldTimer, recoverySeconds);
            car.blockedTime = 0;
            car.stuckTime = 0;
          } else {
            car.yieldTimer = Math.max(car.yieldTimer, 0.25);
            car.blockedTime = Math.max(car.blockedTime, previousBlockedTime, 0.4);
            car.stuckTime = Math.max(car.stuckTime, previousStuckTime, 0.4);
          }
          car.overtakeTimer = 0;
          car.emergencyTimer = 0;
          car.reverseTimer = 0;
        }
        if (policeCapturedPlayer || policeFrontCrash) {
          startGameOver();
        } else if (dotV > 16 && car.playerHitCooldown <= 0) {
          car.playerHitCooldown = 0.9;
          reportPlayerHit(car);
        }
        return true;
      }

      if (a.continuesInto(b) || b.continuesInto(a)) {
        applyAICarImpact(a, b, nx, ny, overlap * 0.45);
        const behind = a.continuesInto(b) ? a : b;
        const ahead = behind === a ? b : a;
        behind.progress = Math.max(0.04, behind.progress - overlap / CELL * 0.85);
        ahead.progress = Math.min(0.96, ahead.progress + overlap / CELL * 0.35);
        behind.yieldTimer = 0.25;
        behind.overtakeTimer = 0;
        behind.targetLateral = 0;
        behind.refreshPosition();
        ahead.refreshPosition();
        return true;
      }

      if (a.sameSegment(b) && !a.sameTrafficLane(b)) {
        applyAICarImpact(a, b, nx, ny, overlap * 0.35);
        const behind = a.progress < b.progress ? a : b;
        behind.overtakeTimer = 0;
        behind.targetLateral = 0;
        behind.progress = Math.max(0.04, behind.progress - overlap / CELL * 0.55);

        const merging = Math.abs(a.lateralOffset) > Math.abs(b.lateralOffset) ? a : b;
        merging.overtakeTimer = 0;
        merging.targetLateral = 0;
        merging.lateralOffset += (0 - merging.lateralOffset) * 0.35;
        a.refreshPosition();
        b.refreshPosition();
        return true;
      }

      if (a.sameSegment(b)) {
        applyAICarImpact(a, b, nx, ny, overlap * 0.3);
        const progressPush = overlap / CELL;
        if (a.progress < b.progress) {
          const oldA = a.progress;
          a.progress = Math.max(0.02, a.progress - progressPush * 0.85);
          b.progress = Math.min(0.98, b.progress + progressPush * (oldA <= 0.04 ? 0.95 : 0.45));
          a.yieldTimer = 0.2;
        } else {
          const oldB = b.progress;
          b.progress = Math.max(0.02, b.progress - progressPush * 0.85);
          a.progress = Math.min(0.98, a.progress + progressPush * (oldB <= 0.04 ? 0.95 : 0.45));
          b.yieldTimer = 0.2;
        }
        a.refreshPosition();
        b.refreshPosition();
        return true;
      } else {
        applyAICarImpact(a, b, nx, ny, overlap * 0.45);
        const priority = a.chasing || (!b.chasing && a.fromIX + a.fromIY < b.fromIX + b.fromIY) ? a : b;
        const yielding = priority === a ? b : a;
        yielding.progress = Math.max(0.03, yielding.progress - overlap / CELL * 0.9);
        yielding.yieldTimer = 0.45;
        priority.progress = Math.min(0.98, priority.progress + overlap / CELL * 0.22);
        priority.refreshPosition();
        yielding.refreshPosition();
        return true;
      }
    }

    function resolveCollisions() {
      for (let pass = 0; pass < 3; pass++) {
        for (let i = 0; i < cars.length; i++) {
          resolveCarPair(player, cars[i]);
          for (let j = i + 1; j < cars.length; j++) {
            if (Math.abs(cars[i].x - cars[j].x) > 36 || Math.abs(cars[i].y - cars[j].y) > 36) continue;
            resolveCarPair(cars[i], cars[j]);
          }
        }
      }
      pushPlayerOutOfBuilding();
    }

    function update(dt) {
      if (gameOverTimer > 0) {
        const elapsed = (performance.now() - gameOverStartedAt) / 1000;
        gameOverTimer = Math.max(0, GAME_OVER_SECONDS - elapsed);
        if (!gameOverFading && elapsed >= GAME_OVER_SPLASH_SECONDS) {
          gameOverFading = true;
          document.body.classList.add("game-over-fade");
        }
        if (elapsed >= GAME_OVER_SECONDS) restartGame();
        return;
      }

      survivalTime += dt;
      updatePlayer(dt);
      for (const car of cars) car.update(dt, cars, player);
      updatePoliceChases();
      resolveCollisions();
      updateNoChaseTimer(dt);

      for (const ped of pedestrians) {
        ped.t += ped.speed * dt;
        if (ped.t >= 4) ped.t -= 4;
      }
    }

    function createCamera() {
      const speedFactor = Math.min(1, Math.abs(player.speed) / player.maxSpeed);
      const zoom = 1.52 - speedFactor * 0.52;
      return {
        x: player.x,
        y: player.y,
        w: window.innerWidth,
        h: window.innerHeight,
        scale: Math.max(0.94, zoom)
      };
    }

    function worldToScreen(x, y, cam) {
      return {
        x: (x - cam.x) * cam.scale + cam.w / 2,
        y: (y - cam.y) * cam.scale + cam.h / 2
      };
    }

    function formatDebugNumber(value, digits = 1) {
      if (value === undefined || value === null || !Number.isFinite(value)) return ".";
      return Number(value).toFixed(digits);
    }

    function normalizeDebugRect(x1, y1, x2, y2) {
      let left = clamp(Math.min(x1, x2), 0, window.innerWidth);
      let top = clamp(Math.min(y1, y2), 0, window.innerHeight);
      let right = clamp(Math.max(x1, x2), 0, window.innerWidth);
      let bottom = clamp(Math.max(y1, y2), 0, window.innerHeight);

      if (right - left < DEBUG_RECORDER_MIN_SIZE) {
        const cx = clamp((left + right) / 2, 0, window.innerWidth);
        left = clamp(cx - DEBUG_RECORDER_MIN_SIZE / 2, 0, Math.max(0, window.innerWidth - DEBUG_RECORDER_MIN_SIZE));
        right = left + DEBUG_RECORDER_MIN_SIZE;
      }
      if (bottom - top < DEBUG_RECORDER_MIN_SIZE) {
        const cy = clamp((top + bottom) / 2, 0, window.innerHeight);
        top = clamp(cy - DEBUG_RECORDER_MIN_SIZE / 2, 0, Math.max(0, window.innerHeight - DEBUG_RECORDER_MIN_SIZE));
        bottom = top + DEBUG_RECORDER_MIN_SIZE;
      }

      return {
        x: left,
        y: top,
        w: Math.max(DEBUG_RECORDER_MIN_SIZE, right - left),
        h: Math.max(DEBUG_RECORDER_MIN_SIZE, bottom - top)
      };
    }

    function setDebugShade(el, x, y, w, h) {
      if (w <= 0 || h <= 0) {
        el.style.display = "none";
        return;
      }

      el.style.display = "block";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.width = w + "px";
      el.style.height = h + "px";
    }

    function setDebugSelectionShade(rect) {
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      if (debugRecorder.mode !== "selecting") {
        for (const el of Object.values(debugRecorderShadeEls)) el.style.display = "none";
        return;
      }

      if (!rect) {
        setDebugShade(debugRecorderShadeEls.top, 0, 0, screenW, screenH);
        setDebugShade(debugRecorderShadeEls.right, 0, 0, 0, 0);
        setDebugShade(debugRecorderShadeEls.bottom, 0, 0, 0, 0);
        setDebugShade(debugRecorderShadeEls.left, 0, 0, 0, 0);
        return;
      }

      const left = clamp(rect.x, 0, screenW);
      const top = clamp(rect.y, 0, screenH);
      const right = clamp(rect.x + rect.w, 0, screenW);
      const bottom = clamp(rect.y + rect.h, 0, screenH);

      setDebugShade(debugRecorderShadeEls.top, 0, 0, screenW, top);
      setDebugShade(debugRecorderShadeEls.right, right, top, screenW - right, bottom - top);
      setDebugShade(debugRecorderShadeEls.bottom, 0, bottom, screenW, screenH - bottom);
      setDebugShade(debugRecorderShadeEls.left, 0, top, left, bottom - top);
    }

    function setDebugSelectionBox(rect) {
      debugRecorderSelectionEl.style.display = rect ? "block" : "none";
      setDebugSelectionShade(rect);
      if (!rect) return;
      debugRecorderSelectionEl.style.left = rect.x + "px";
      debugRecorderSelectionEl.style.top = rect.y + "px";
      debugRecorderSelectionEl.style.width = rect.w + "px";
      debugRecorderSelectionEl.style.height = rect.h + "px";
    }

    function refreshDebugRecorderOverlay() {
      if (debugRecorder.mode === "selecting" && debugRecorder.selecting) {
        setDebugSelectionBox(normalizeDebugRect(
          debugRecorder.startX,
          debugRecorder.startY,
          debugRecorder.currentX,
          debugRecorder.currentY
        ));
        return;
      }

      setDebugSelectionBox(debugRecorder.area);
    }

    function updateDebugClasses() {
      document.body.classList.toggle("debug-selecting", debugRecorder.mode === "selecting");
      document.body.classList.toggle("debug-recording", debugRecorder.mode === "recording");
      document.body.classList.toggle("debug-recorder-status", debugRecorder.mode === "status");
    }

    function startDebugSelection() {
      debugRecorder.mode = "selecting";
      debugRecorder.selecting = false;
      debugRecorder.pointerId = null;
      debugRecorder.area = null;
      debugRecorder.startedAt = 0;
      debugRecorder.copiedAt = 0;
      debugRecorder.frames = 0;
      debugRecorder.rows.length = 0;
      debugRecorderMessageEl.textContent = "Select interesting area.";
      setDebugSelectionBox(null);
      updateDebugClasses();
    }

    function startDebugRecording(area) {
      debugRecorder.mode = "recording";
      debugRecorder.selecting = false;
      debugRecorder.pointerId = null;
      debugRecorder.area = area;
      debugRecorder.startedAt = performance.now();
      debugRecorder.frames = 0;
      debugRecorder.rows.length = 0;
      debugRecorderMessageEl.textContent = "Recording car movement. Press Space to copy.";
      setDebugSelectionBox(area);
      updateDebugClasses();
    }

    function showDebugStatus(text) {
      debugRecorder.mode = "status";
      debugRecorder.copiedAt = performance.now();
      debugRecorderMessageEl.textContent = text;
      setDebugSelectionBox(null);
      updateDebugClasses();
    }

    function updateDebugStatus(now) {
      if (debugRecorder.mode !== "status") return;
      if (now - debugRecorder.copiedAt < DEBUG_RECORDER_STATUS_MS) return;
      debugRecorder.mode = "idle";
      updateDebugClasses();
    }

    function cancelDebugRecording() {
      if (debugRecorder.pointerId !== null && debugRecorderEl.hasPointerCapture(debugRecorder.pointerId)) {
        debugRecorderEl.releasePointerCapture(debugRecorder.pointerId);
      }
      debugRecorder.mode = "idle";
      debugRecorder.selecting = false;
      debugRecorder.pointerId = null;
      debugRecorder.area = null;
      debugRecorder.startedAt = 0;
      debugRecorder.copiedAt = 0;
      debugRecorder.frames = 0;
      debugRecorder.rows.length = 0;
      debugRecorderMessageEl.textContent = "";
      setDebugSelectionBox(null);
      updateDebugClasses();
    }

    function debugPointerPoint(event) {
      return {
        x: clamp(event.clientX, 0, window.innerWidth),
        y: clamp(event.clientY, 0, window.innerHeight)
      };
    }

    function carIntersectsDebugArea(car, cam) {
      if (!debugRecorder.area) return null;
      const p = worldToScreen(car.x, car.y, cam);
      const radius = (car.radius || 16) * cam.scale;
      const area = debugRecorder.area;
      if (p.x + radius < area.x || p.x - radius > area.x + area.w) return null;
      if (p.y + radius < area.y || p.y - radius > area.y + area.h) return null;
      return p;
    }

    function debugCarType(car, isPlayer) {
      if (isPlayer) return "player";
      return car.isPolice ? "police" : "traffic";
    }

    function debugCarRow(car, isPlayer, screenPoint, timeMs) {
      return [
        String(timeMs),
        isPlayer ? "p" : String(car.id),
        debugCarType(car, isPlayer),
        formatDebugNumber(car.x),
        formatDebugNumber(car.y),
        formatDebugNumber(car.angle, 3),
        formatDebugNumber(carSpriteAngle(car), 3),
        formatDebugNumber(car.speed || 0),
        formatDebugNumber(car.motionX || 0),
        formatDebugNumber(car.motionY || 0),
        formatDebugNumber(screenPoint.x),
        formatDebugNumber(screenPoint.y),
        isPlayer ? "." : car.fromIX,
        isPlayer ? "." : car.fromIY,
        isPlayer ? "." : car.toIX,
        isPlayer ? "." : car.toIY,
        isPlayer ? "." : formatDebugNumber(car.progress, 4),
        isPlayer ? "." : formatDebugNumber(car.lateralOffset || 0),
        isPlayer ? "." : formatDebugNumber(car.pushX || 0),
        isPlayer ? "." : formatDebugNumber(car.pushY || 0),
        isPlayer ? "." : formatDebugNumber(car.pushVX || 0),
        isPlayer ? "." : formatDebugNumber(car.pushVY || 0),
        isPlayer ? "." : (car.chasing ? 1 : 0),
        isPlayer ? "." : formatDebugNumber(car.blockedTime || 0, 2),
        isPlayer ? "." : formatDebugNumber(car.hitStopTimer || 0, 2)
      ].join("\t");
    }

    function recordDebugFrame(cam, now) {
      if (debugRecorder.mode !== "recording" || !debugRecorder.area) return;
      const timeMs = Math.max(0, Math.round(now - debugRecorder.startedAt));
      let visibleCars = 0;

      const playerPoint = carIntersectsDebugArea(player, cam);
      if (playerPoint) {
        debugRecorder.rows.push(debugCarRow(player, true, playerPoint, timeMs));
        visibleCars++;
      }

      for (const car of cars) {
        const screenPoint = carIntersectsDebugArea(car, cam);
        if (!screenPoint) continue;
        debugRecorder.rows.push(debugCarRow(car, false, screenPoint, timeMs));
        visibleCars++;
      }

      debugRecorder.frames++;
      debugRecorderMessageEl.textContent = "Recording " + (timeMs / 1000).toFixed(1) + "s  Cars " + visibleCars + "  Press Space to copy.";
    }

    function buildDebugRecordingText() {
      const area = debugRecorder.area || { x: 0, y: 0, w: 0, h: 0 };
      return [
        "# tunnel-car-recording-v1",
        "# selection_screen_px\t" + [
          formatDebugNumber(area.x),
          formatDebugNumber(area.y),
          formatDebugNumber(area.w),
          formatDebugNumber(area.h)
        ].join("\t"),
        "# frames\t" + debugRecorder.frames,
        DEBUG_RECORDER_COLUMNS.join("\t"),
        ...debugRecorder.rows
      ].join("\n");
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      textArea.style.top = "0";
      document.body.appendChild(textArea);
      textArea.select();
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } finally {
        textArea.remove();
      }
      return copied;
    }

    async function copyDebugRecording() {
      if (debugRecorder.mode !== "recording") return;
      const text = buildDebugRecordingText();
      const rowCount = debugRecorder.rows.length;
      debugRecorder.mode = "status";
      debugRecorder.copiedAt = performance.now();
      debugRecorderMessageEl.textContent = "Copying recording...";
      updateDebugClasses();
      let copied = false;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (error) {
          copied = false;
        }
      }

      if (!copied) copied = fallbackCopyText(text);
      if (!copied) console.log(text);

      debugRecorder.rows.length = 0;
      debugRecorder.area = null;
      showDebugStatus(copied ? "Recorded " + rowCount + " rows copied." : "Clipboard blocked. Recording logged to console.");
    }

    function drawWorldRect(x, y, w, h, cam, color) {
      const p = worldToScreen(x, y, cam);
      ctx.fillStyle = color;
      ctx.fillRect(p.x, p.y, w * cam.scale, h * cam.scale);
    }

    function rectVisible(x, y, w, h, cam, pad = 90) {
      const p = worldToScreen(x, y, cam);
      return p.x + w * cam.scale > -pad && p.y + h * cam.scale > -pad && p.x < cam.w + pad && p.y < cam.h + pad;
    }

    function drawRoads(cam) {
      ctx.fillStyle = palette.grass;
      ctx.fillRect(0, 0, cam.w, cam.h);

      const minX = cam.x - cam.w / (2 * cam.scale) - 80;
      const maxX = cam.x + cam.w / (2 * cam.scale) + 80;
      const minY = cam.y - cam.h / (2 * cam.scale) - 80;
      const maxY = cam.y + cam.h / (2 * cam.scale) + 80;

      for (let i = 0; i <= GRID; i++) {
        const roadStart = i * CELL;
        if (roadStart <= maxY && roadStart + ROAD >= minY) {
          drawWorldRect(0, roadStart, WORLD, ROAD, cam, palette.road);
          drawWorldRect(0, roadStart, WORLD, 5, cam, palette.roadDark);
          drawWorldRect(0, roadStart + ROAD - 5, WORLD, 5, cam, palette.roadDark);
        }
        if (roadStart <= maxX && roadStart + ROAD >= minX) {
          drawWorldRect(roadStart, 0, ROAD, WORLD, cam, palette.road);
          drawWorldRect(roadStart, 0, 5, WORLD, cam, palette.roadDark);
          drawWorldRect(roadStart + ROAD - 5, 0, 5, WORLD, cam, palette.roadDark);
        }
      }

      ctx.save();
      ctx.strokeStyle = palette.lane;
      ctx.lineWidth = Math.max(1, 2.2 * cam.scale);
      ctx.setLineDash([22 * cam.scale, 20 * cam.scale]);
      for (let i = 0; i <= GRID; i++) {
        const y = worldToScreen(0, i * CELL + ROAD / 2, cam).y;
        if (y < -50 || y > cam.h + 50) continue;
        ctx.beginPath();
        ctx.moveTo(worldToScreen(0, 0, cam).x, y);
        ctx.lineTo(worldToScreen(WORLD, 0, cam).x, y);
        ctx.stroke();
      }
      for (let i = 0; i <= GRID; i++) {
        const x = worldToScreen(i * CELL + ROAD / 2, 0, cam).x;
        if (x < -50 || x > cam.w + 50) continue;
        ctx.beginPath();
        ctx.moveTo(x, worldToScreen(0, 0, cam).y);
        ctx.lineTo(x, worldToScreen(0, WORLD, cam).y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255, 244, 221, 0.52)";
      ctx.lineWidth = Math.max(1, 1.25 * cam.scale);
      for (let i = 0; i <= GRID; i++) {
        const a = i * CELL + 8;
        const b = i * CELL + ROAD - 8;
        for (const yWorld of [a, b]) {
