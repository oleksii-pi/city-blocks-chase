          const y = worldToScreen(0, yWorld, cam).y;
          ctx.beginPath();
          ctx.moveTo(worldToScreen(0, 0, cam).x, y);
          ctx.lineTo(worldToScreen(WORLD, 0, cam).x, y);
          ctx.stroke();
        }
        for (const xWorld of [a, b]) {
          const x = worldToScreen(xWorld, 0, cam).x;
          ctx.beginPath();
          ctx.moveTo(x, worldToScreen(0, 0, cam).y);
          ctx.lineTo(x, worldToScreen(0, WORLD, cam).y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawPoly(points, fill, stroke = null) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function quadPoint(tl, tr, br, bl, u, v) {
      const topX = tl.x + (tr.x - tl.x) * u;
      const topY = tl.y + (tr.y - tl.y) * u;
      const bottomX = bl.x + (br.x - bl.x) * u;
      const bottomY = bl.y + (br.y - bl.y) * u;
      return {
        x: topX + (bottomX - topX) * v,
        y: topY + (bottomY - topY) * v
      };
    }

    function insetQuad(points, amount) {
      const cx = points.reduce((sum, p) => sum + p.x, 0) / points.length;
      const cy = points.reduce((sum, p) => sum + p.y, 0) / points.length;
      return points.map(p => ({
        x: p.x + (cx - p.x) * amount,
        y: p.y + (cy - p.y) * amount
      }));
    }

    function faceQuad(tl, tr, br, bl, u0, u1, v0, v1) {
      return [
        quadPoint(tl, tr, br, bl, u0, v0),
        quadPoint(tl, tr, br, bl, u1, v0),
        quadPoint(tl, tr, br, bl, u1, v1),
        quadPoint(tl, tr, br, bl, u0, v1)
      ];
    }

    function drawWindowOnFace(tl, tr, br, bl, u0, u1, v0, v1) {
      const frame = faceQuad(tl, tr, br, bl, u0, u1, v0, v1);
      drawPoly(frame, palette.frame, "rgba(70, 54, 38, 0.28)");

      const glass = insetQuad(frame, 0.18);
      drawPoly(glass, palette.glass);

      const darkPane = faceQuad(tl, tr, br, bl, u0 + (u1 - u0) * 0.52, u1 - (u1 - u0) * 0.16, v0 + (v1 - v0) * 0.18, v1 - (v1 - v0) * 0.18);
      drawPoly(darkPane, palette.glassDark);

      const vDiv = faceQuad(tl, tr, br, bl, u0 + (u1 - u0) * 0.47, u0 + (u1 - u0) * 0.54, v0 + (v1 - v0) * 0.18, v1 - (v1 - v0) * 0.18);
      const hDiv = faceQuad(tl, tr, br, bl, u0 + (u1 - u0) * 0.16, u1 - (u1 - u0) * 0.16, v0 + (v1 - v0) * 0.47, v0 + (v1 - v0) * 0.54);
      drawPoly(vDiv, palette.frame);
      drawPoly(hDiv, palette.frame);
    }

    function buildingRise(house) {
      return 8 + house.floors * 5.5;
    }

    function drawBuilding(baseX, baseY, size, house, cam) {
      const inset = 5;
      const x = baseX + inset;
      const y = baseY + inset;
      const w = size - inset * 2;
      const h = size - inset * 2;
      const floors = house.floors;
      const rise = buildingRise(house);
      const roofColor = house.police ? palette.policeRoof : palette.roof[house.colorIndex];
      const rightColor = house.police ? palette.policeFace : palette.rightFace[house.colorIndex];
      const bottomColor = house.police ? "#35699f" : palette.bottomFace[house.colorIndex];

      const a = worldToScreen(x, y, cam);
      const b = worldToScreen(x + w, y, cam);
      const c = worldToScreen(x + w, y + h, cam);
      const d = worldToScreen(x, y + h, cam);
      const hx = -rise * 0.42 * cam.scale;
      const hy = -rise * 0.72 * cam.scale;
      const at = { x: a.x + hx, y: a.y + hy };
      const bt = { x: b.x + hx, y: b.y + hy };
      const ct = { x: c.x + hx, y: c.y + hy };
      const dt = { x: d.x + hx, y: d.y + hy };

      const shadowOffset = 7 * cam.scale;
      drawPoly([
        { x: a.x + shadowOffset, y: a.y + shadowOffset },
        { x: b.x + shadowOffset, y: b.y + shadowOffset },
        { x: c.x + shadowOffset * 1.7, y: c.y + shadowOffset * 1.5 },
        { x: d.x + shadowOffset * 1.3, y: d.y + shadowOffset * 1.8 }
      ], palette.shadow);

      const southFace = [dt, ct, c, d];
      const eastFace = [bt, ct, c, b];
      drawPoly(southFace, bottomColor, "rgba(67, 42, 29, 0.24)");
      drawPoly(eastFace, rightColor, "rgba(67, 42, 29, 0.24)");

      for (let row = 0; row < floors; row++) {
        const v0 = (row + 0.18) / floors;
        const v1 = (row + 0.68) / floors;
        drawWindowOnFace(dt, ct, c, d, 0.18, 0.34, v0, v1);
        drawWindowOnFace(dt, ct, c, d, 0.62, 0.78, v0, v1);
        drawWindowOnFace(bt, ct, c, b, 0.18, 0.34, v0, v1);
        drawWindowOnFace(bt, ct, c, b, 0.60, 0.76, v0, v1);
      }

      drawPoly([at, bt, ct, dt], roofColor, "rgba(65, 43, 30, 0.48)");

      ctx.strokeStyle = "rgba(255, 231, 178, 0.22)";
      ctx.lineWidth = Math.max(1, cam.scale * 0.8);
      ctx.beginPath();
      ctx.moveTo(at.x, at.y);
      ctx.lineTo(bt.x, bt.y);
      ctx.lineTo(ct.x, ct.y);
      ctx.lineTo(dt.x, dt.y);
      ctx.closePath();
      ctx.stroke();

      if (house.police) {
        const signP = quadPoint(at, bt, ct, dt, 0.5, 0.52);
        ctx.fillStyle = "#ffffff";
        ctx.font = `${Math.max(9, 14 * cam.scale)}px ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("P", signP.x, signP.y);
      }
    }

    function blockVisible(block, cam) {
      const x = blockWorldX(block.gx);
      const y = blockWorldY(block.gy);
      return rectVisible(x - 55, y - 70, BLOCK + 125, BLOCK + 140, cam);
    }

    function drawBlockGround(block, cam) {
      if (!blockVisible(block, cam)) return;
      const x = blockWorldX(block.gx);
      const y = blockWorldY(block.gy);
      drawWorldRect(x - 9, y - 9, BLOCK + 18, BLOCK + 18, cam, palette.sidewalk);
      drawWorldRect(x + HOUSE - 4, y + HOUSE - 4, HOUSE + 8, HOUSE + 8, cam, palette.courtyard);

      ctx.strokeStyle = "rgba(255, 246, 217, 0.42)";
      ctx.lineWidth = Math.max(1, 1.2 * cam.scale);
      const p = worldToScreen(x - 9, y - 9, cam);
      ctx.strokeRect(p.x, p.y, (BLOCK + 18) * cam.scale, (BLOCK + 18) * cam.scale);

      drawWorldRect(x + 8, y + 8, BLOCK - 16, 7, cam, palette.sidewalkLight);
      drawWorldRect(x + 8, y + BLOCK - 15, BLOCK - 16, 7, cam, palette.sidewalkLight);
      drawWorldRect(x + 8, y + 8, 7, BLOCK - 16, cam, palette.sidewalkLight);
      drawWorldRect(x + BLOCK - 15, y + 8, 7, BLOCK - 16, cam, palette.sidewalkLight);
    }

    function queueBlockBuildings(block, renderables, cam) {
      if (!blockVisible(block, cam)) return;
      const x = blockWorldX(block.gx);
      const y = blockWorldY(block.gy);
      for (const house of block.houses) {
        const baseX = x + house.hx * HOUSE;
        const baseY = y + house.hy * HOUSE;
        const rise = buildingRise(house);
        if (!rectVisible(baseX - rise * 0.48, baseY - rise * 0.78, HOUSE + rise * 0.6, HOUSE + rise * 0.9, cam, 50)) continue;
        renderables.push({
          depth: baseY + HOUSE - 5,
          order: renderables.length,
          draw: () => drawBuilding(baseX, baseY, HOUSE, house, cam)
        });
      }
    }

    function drawPedestrian(ped, cam) {
      const [x, y] = pedestrianPosition(ped);
      const p = worldToScreen(x, y, cam);
      ctx.fillStyle = "rgba(30, 22, 18, 0.22)";
      ctx.beginPath();
      ctx.ellipse(p.x + 2 * cam.scale, p.y + 3 * cam.scale, 3 * cam.scale, 2 * cam.scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ped.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(2.2, 3.2 * cam.scale), 0, Math.PI * 2);
      ctx.fill();
    }

    function desiredCarRenderAngle(car, vx, vy) {
      const heading = car.angle ?? car.renderAngle ?? 0;
      if (Math.hypot(vx, vy) <= CAR_PHYSICS.renderMinVectorSpeed) return heading;

      const forwardDot = Math.cos(heading) * vx + Math.sin(heading) * vy;
      const sideDot = -Math.sin(heading) * vx + Math.cos(heading) * vy;
      const movingBackward = forwardDot < -CAR_PHYSICS.renderMinVectorSpeed;
      const maxSlip = movingBackward ? CAR_PHYSICS.renderMaxReverseSlipAngle : CAR_PHYSICS.renderMaxSlipAngle;
      const slip = clamp(Math.atan2(sideDot, Math.max(Math.abs(forwardDot), CAR_PHYSICS.renderMinVectorSpeed)), -maxSlip, maxSlip);

      return heading + (movingBackward ? -slip : slip);
    }

    function updateCarRenderAngle(car, vx, vy, dt) {
      const heading = car.angle ?? car.renderAngle ?? 0;
      if (car.renderAngle === undefined) car.renderAngle = heading;
      if (Math.hypot(vx, vy) <= CAR_PHYSICS.renderMinVectorSpeed) {
        car.renderAngle = approachAngle(car.renderAngle, heading, CAR_PHYSICS.renderTurnRate * dt);
        return;
      }

      const desired = desiredCarRenderAngle(car, vx, vy);
      car.renderAngle = approachAngle(car.renderAngle, desired, CAR_PHYSICS.renderTurnRate * dt);
    }

    function carSpriteAngle(car) {
      return car.renderAngle ?? car.angle ?? 0;
    }

    function drawCar(car, cam, isPlayer = false) {
      if (!rectVisible(car.x - 35, car.y - 35, 70, 70, cam, 50)) return;
      const p = worldToScreen(car.x, car.y, cam);
      const scale = cam.scale;
      const length = (car.length || player.length) * scale;
      const width = (car.width || player.width) * scale;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(carSpriteAngle(car));
      ctx.fillStyle = "rgba(0, 0, 0, 0.26)";
      ctx.fillRect(-length / 2 + 2 * scale, -width / 2 + 3 * scale, length, width);

      ctx.fillStyle = isPlayer ? "#f1c343" : car.color;
      ctx.beginPath();
      ctx.moveTo(length / 2, 0);
      ctx.lineTo(length * 0.28, -width / 2);
      ctx.lineTo(-length * 0.42, -width / 2);
      ctx.lineTo(-length / 2, -width * 0.3);
      ctx.lineTo(-length / 2, width * 0.3);
      ctx.lineTo(-length * 0.42, width / 2);
      ctx.lineTo(length * 0.28, width / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#bfe4ed";
      ctx.fillRect(-length * 0.05, -width * 0.36, length * 0.26, width * 0.72);
      ctx.fillStyle = "#1e2527";
      ctx.fillRect(-length * 0.36, -width * 0.58, length * 0.18, width * 0.18);
      ctx.fillRect(-length * 0.36, width * 0.4, length * 0.18, width * 0.18);
      ctx.fillRect(length * 0.25, -width * 0.58, length * 0.18, width * 0.18);
      ctx.fillRect(length * 0.25, width * 0.4, length * 0.18, width * 0.18);

      ctx.fillStyle = "#fff8b3";
      ctx.fillRect(length / 2 - 2 * scale, -width * 0.34, 2 * scale, 3 * scale);
      ctx.fillRect(length / 2 - 2 * scale, width * 0.16, 2 * scale, 3 * scale);

      if (isPlayer) {
        ctx.fillStyle = "#d33a32";
        ctx.fillRect(length / 2 - 1.5 * scale, -width * 0.2, 1.5 * scale, width * 0.4);
      }

      if (car.isPolice) {
        const blink = Math.floor(performance.now() / 160) % 2;
        ctx.fillStyle = blink ? "#e92828" : "#3a65ff";
        ctx.fillRect(-2 * scale, -width * 0.42, 4 * scale, width * 0.42);
        ctx.fillStyle = blink ? "#3a65ff" : "#e92828";
        ctx.fillRect(-2 * scale, 0, 4 * scale, width * 0.42);
      }

      ctx.restore();
    }

    function draw(cam) {
      drawRoads(cam);
      const renderables = [];

      const minGX = clamp(Math.floor((cam.x - cam.w / (2 * cam.scale) - ROAD) / CELL) - 1, 0, GRID - 1);
      const maxGX = clamp(Math.ceil((cam.x + cam.w / (2 * cam.scale) - ROAD) / CELL) + 1, 0, GRID - 1);
      const minGY = clamp(Math.floor((cam.y - cam.h / (2 * cam.scale) - ROAD) / CELL) - 1, 0, GRID - 1);
      const maxGY = clamp(Math.ceil((cam.y + cam.h / (2 * cam.scale) - ROAD) / CELL) + 1, 0, GRID - 1);

      for (let gy = minGY; gy <= maxGY; gy++) {
        for (let gx = minGX; gx <= maxGX; gx++) {
          const block = blockAt(gx, gy);
          drawBlockGround(block, cam);
          queueBlockBuildings(block, renderables, cam);
        }
      }

      for (const ped of pedestrians) {
        const [x, y] = pedestrianPosition(ped);
        if (!rectVisible(x - 5, y - 5, 10, 10, cam, 30)) continue;
        renderables.push({
          depth: y + 4,
          order: renderables.length,
          draw: () => drawPedestrian(ped, cam)
        });
      }

      for (const car of cars) {
        if (!rectVisible(car.x - 35, car.y - 35, 70, 70, cam, 50)) continue;
        renderables.push({
          depth: car.y + (car.radius || 16),
          order: renderables.length,
          draw: () => drawCar(car, cam)
        });
      }
      renderables.push({
        depth: player.y + player.radius,
        order: renderables.length,
        draw: () => drawCar(player, cam, true)
      });

      renderables.sort((a, b) => a.depth - b.depth || a.order - b.order);
      for (const item of renderables) item.draw();
    }

    function drawMinimapDot(mapCtx, x, y, radius, fill, stroke = null) {
      mapCtx.beginPath();
      mapCtx.arc(x, y, radius, 0, Math.PI * 2);
      mapCtx.fillStyle = fill;
      mapCtx.fill();
      if (stroke) {
        mapCtx.strokeStyle = stroke;
        mapCtx.lineWidth = 1;
        mapCtx.stroke();
      }
    }

    function drawMinimap() {
      const visible = wantedLevel > 0;
      minimapCanvas.classList.toggle("visible", visible);
      if (!visible) return;

      const scale = MINIMAP_SIZE / WORLD;
      minimapCtx.clearRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);
      minimapCtx.fillStyle = "#20252a";
      minimapCtx.fillRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

      minimapCtx.fillStyle = "rgba(188, 168, 111, 0.25)";
      minimapCtx.strokeStyle = "rgba(255, 244, 210, 0.15)";
      minimapCtx.lineWidth = 1;
      for (const block of blocks) {
        const x = blockWorldX(block.gx) * scale;
        const y = blockWorldY(block.gy) * scale;
        const size = BLOCK * scale;
        minimapCtx.fillRect(x, y, size, size);
        minimapCtx.strokeRect(x, y, size, size);
      }

      for (const police of policeCars) {
        drawMinimapDot(
          minimapCtx,
          police.x * scale,
          police.y * scale,
          police.chasing ? 3.2 : 2.4,
          "#e33232",
          police.chasing ? "#fff2cf" : null
        );
      }

      drawMinimapDot(minimapCtx, player.x * scale, player.y * scale, 3.5, "#f1c343", "#2b2111");
    }

    function updateHud() {
      const minutes = Math.floor(survivalTime / 60);
      const seconds = Math.floor(survivalTime % 60).toString().padStart(2, "0");
      speedEl.textContent = "Speed " + Math.round(Math.abs(player.speed));
      wantedEl.textContent = "Chasers " + wantedLevel;
      survivalEl.textContent = "Time " + minutes + ":" + seconds;
      hitScoreEl.textContent = hitScore;
      hitBonusEl.textContent = hitCount ? "Hits " + hitCount + "  +" + lastHitPoints : "";
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
      lastTime = now;
      if (debugRecorder.mode !== "selecting") update(dt);
      const cam = createCamera();
      draw(cam);
      recordDebugFrame(cam, now);
      updateHud();
      drawMinimap();
      updateDebugStatus(now);
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", () => {
      resize();
      refreshDebugRecorderOverlay();
    });
    window.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "d" && !event.metaKey && !event.ctrlKey && !event.altKey) {
        event.preventDefault();
        if (!event.repeat && debugRecorder.mode !== "recording") startDebugSelection();
        return;
      }
      if ((event.code === "Space" || event.key === " ") && debugRecorder.mode === "recording") {
        event.preventDefault();
        copyDebugRecording();
        return;
      }
      if (event.key === "Escape" && debugRecorder.mode !== "idle") {
        event.preventDefault();
        cancelDebugRecording();
        return;
      }
      if (event.key.startsWith("Arrow")) {
        event.preventDefault();
        keys.add(event.key);
      }
    });
    window.addEventListener("keyup", event => {
      if (event.key.startsWith("Arrow")) keys.delete(event.key);
    });

    for (const button of document.querySelectorAll(".control")) {
      const key = button.dataset.key;
      const press = event => {
        event.preventDefault();
        keys.add(key);
        button.classList.add("active");
      };
      const release = event => {
        event.preventDefault();
        keys.delete(key);
        button.classList.remove("active");
      };
      button.addEventListener("pointerdown", press);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("pointerleave", release);
    }

    debugRecorderEl.addEventListener("pointerdown", event => {
      if (debugRecorder.mode !== "selecting") return;
      event.preventDefault();
      const point = debugPointerPoint(event);
      debugRecorder.selecting = true;
      debugRecorder.pointerId = event.pointerId;
      debugRecorder.startX = point.x;
      debugRecorder.startY = point.y;
      debugRecorder.currentX = point.x;
      debugRecorder.currentY = point.y;
      debugRecorderEl.setPointerCapture(event.pointerId);
      setDebugSelectionBox(normalizeDebugRect(point.x, point.y, point.x, point.y));
    });

    debugRecorderEl.addEventListener("pointermove", event => {
      if (debugRecorder.mode !== "selecting" || !debugRecorder.selecting || event.pointerId !== debugRecorder.pointerId) return;
      event.preventDefault();
      const point = debugPointerPoint(event);
      debugRecorder.currentX = point.x;
      debugRecorder.currentY = point.y;
      setDebugSelectionBox(normalizeDebugRect(debugRecorder.startX, debugRecorder.startY, point.x, point.y));
    });

    debugRecorderEl.addEventListener("pointerup", event => {
      if (debugRecorder.mode !== "selecting" || !debugRecorder.selecting || event.pointerId !== debugRecorder.pointerId) return;
      event.preventDefault();
      const point = debugPointerPoint(event);
      const area = normalizeDebugRect(debugRecorder.startX, debugRecorder.startY, point.x, point.y);
      if (debugRecorderEl.hasPointerCapture(event.pointerId)) debugRecorderEl.releasePointerCapture(event.pointerId);
      startDebugRecording(area);
    });

    debugRecorderEl.addEventListener("pointercancel", event => {
      if (debugRecorder.mode !== "selecting" || event.pointerId !== debugRecorder.pointerId) return;
      event.preventDefault();
      debugRecorder.selecting = false;
      debugRecorder.pointerId = null;
      setDebugSelectionBox(null);
    });

    createBlocks();
    createPedestrians();
    placePlayer();
    createTraffic();
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
