    <linearGradient id="lightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#b9c6cd"/>
